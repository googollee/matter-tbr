name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # HA 2026.9 要求 Python >= 3.14.2,setup_venv.sh 会用 PATH 上的 python3.14
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            homeassistant/requirements-ha-test.txt

      - name: 固件逻辑的主机端单元测试
        run: make fw-test

      - name: HA 集成测试
        run: make ha-test

      - name: HA 集成打包检查
        run: make component
