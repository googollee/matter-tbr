name: enclosure

# 只在外壳相关文件变化时运行
on:
  push:
    paths:
      - "enclosure/**"
      - "config/**"
      - "scripts/gen_enclosure_data.py"
      - "scripts/gen_commissioning.py"
      - "scripts/setup_venv.sh"
      - "scripts/requirements.txt"
      - "Makefile"
      - ".github/workflows/enclosure.yml"
  pull_request:
    paths:
      - "enclosure/**"
      - "config/**"
      - "scripts/gen_enclosure_data.py"
      - "scripts/gen_commissioning.py"
      - "scripts/setup_venv.sh"
      - "scripts/requirements.txt"
      - "Makefile"
      - ".github/workflows/enclosure.yml"

jobs:
  render:
    name: OpenSCAD ${{ matrix.name }}
    runs-on: ubuntu-latest
    # 渲染复杂度很高,旧版本(CGAL)很慢
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 源里的版本(24.04 是 2021.01):外壳要保证在这个最老的版本上能渲染
          - name: "apt (Ubuntu 源)"
            snapshot: false
          # 官方每日 snapshot:提前发现新版本带来的不兼容。snapshot 本身不稳定,失败不挡 CI
          - name: "snapshot (最新)"
            snapshot: true
    continue-on-error: ${{ matrix.snapshot }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            homeassistant/requirements-ha-test.txt

      - name: 安装 OpenSCAD(apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad fonts-liberation
          echo "OPENSCAD=openscad" >> "$GITHUB_ENV"

      - name: 安装 OpenSCAD(最新 snapshot AppImage)
        if: ${{ matrix.snapshot }}
        run: |
          sudo apt-get update
          base=https://files.openscad.org/snapshots
          name=$(curl -fsSL "$base/" | grep -o 'OpenSCAD-[0-9.]*-x86_64\.AppImage' | sort -uV | tail -n 1)
          test -n "$name"
          curl -fsSL -o "$HOME/openscad.AppImage" "$base/$name"
          chmod +x "$HOME/openscad.AppImage"
          echo "OPENSCAD=$HOME/openscad.AppImage" >> "$GITHUB_ENV"
          # runner 上没有 FUSE,AppImage 要解压后运行;也没有显示器
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: OpenSCAD 版本
        run: '"$OPENSCAD" --version'

      # make enclosure 会渲染底壳和上盖,并校验外壳算出的 QR / 手动配对码(config/ 默认值)
      - name: 渲染外壳
        run: make enclosure OPENSCAD="$OPENSCAD"

      - name: 检查输出
        run: |
          for f in base lid; do
            test -s "out/enclosure/$f.stl" || { echo "$f.stl 是空的"; exit 1; }
            ls -l "out/enclosure/$f.stl"
            grep -iE 'warning|error' "out/enclosure/$f.log" || true
          done
